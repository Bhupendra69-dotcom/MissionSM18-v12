
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mission SM18 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e
          WRAPPER="$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"
          test -n "$WRAPPER"
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "No debug APK found. APK files in workspace:"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" out/MissionSM18.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mission-SM18-DayNight-APK
          path: out/MissionSM18.apk
          if-no-files-found: error
          retention-days: 14
